# Nginx alternative to Caddy (use with the systemd service).
# Get a certificate first:  sudo certbot --nginx -d remote.example.com
server {
    listen 80;
    server_name remote.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name remote.example.com;

    ssl_certificate     /etc/letsencrypt/live/remote.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remote.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Longer than the server's 25 s ping interval.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 8m;
    }
}
